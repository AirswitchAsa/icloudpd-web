services:
  icloudpd-web:
    image: spicadust/icloudpd-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-2026.4.20.post1}
        ICLOUDPD_REPO: https://github.com/spmp/icloud_photos_downloader.git
        ICLOUDPD_BRANCH: feature/until-skip-created-before
    container_name: icloudpd-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Server binding. Defaults shown — override as needed.
      HOST: 0.0.0.0
      PORT: 5000

      # Run as this user/group (default 1000:1000). Set to the owner of your
      # bind-mounted host directories (find it with `id`) so the app can
      # write to them — needed on Synology/NAS setups.
      PUID: 1000
      PGID: 1000

      # REQUIRED to enable authentication. Generate with:
      #   docker run --rm spicadust/icloudpd-web:latest icloudpd-web init-password 'yourpw'
      # If omitted, the server runs PASSWORDLESS (warning logged on startup).
      PASSWORD_HASH: ${ICLOUDPD_WEB_PASSWORD_HASH:-}

      # Optional: stable session secret across restarts (else a random one
      # is generated each boot and all sessions are invalidated on restart).
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      SESSION_SECRET: ${ICLOUDPD_WEB_SESSION_SECRET:-}

      # iCloud authentication cookie directory. Shared across all policies /
      # Apple IDs — icloudpd keys cookies by account within this directory.
      # MUST be volume-mounted for persistence; losing it forces re-auth + 2FA.
      ICLOUDPD_COOKIE_DIR: /.pyicloud

    volumes:
      # Persistent state: policies (TOML), passwords, run logs, settings.
      # MUST be mounted or all config is lost on container recreate.
      - ./data:/data

      # iCloud authentication cookies. Shared by all policies / Apple IDs.
      # Mount persistently so re-auth is not required on every restart.
      - ./pyicloud:/.pyicloud

      # Photo download destinations. Mount any directories your policies
      # write to — the `directory` field on each policy must match a path
      # visible inside the container. Example: a policy with
      #   directory = /downloads/main
      # writes to the host path ./downloads/main.
      - ./downloads:/downloads
